name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallify_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wallify_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned rather than read from engines (">=22.12"), so a new major
          # landing on the runner cannot change what CI tested against.
          node-version: "22.x"
          cache: npm

      - run: npm ci

      # Catches a schema change committed without its migration, which would
      # otherwise only fail on deploy.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify schema matches the migration history
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code

      - run: npx prisma generate

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # devDependencies are build-time only; a finding there does not ship.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
